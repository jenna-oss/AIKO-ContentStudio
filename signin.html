<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — AIKO Content Studio</title>
<script src="./assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/nav.css">
<style>
  :root {
    --forest:#0B1A5C; --cream-text:#F3F5F9; --emerald:#3150FD; --sage:#C3CCE8;
    --ground:#F3F5F9; --card:#F9FAFC; --card-sunk:#D9DEE7;
    --ink:#101114; --ink-body:#3C4450; --ink-quiet:#3C4450;
    --rule:#D9DEE7; --rule-strong:#C3CCE8; --accent:#3150FD; --clay:#B52C00;
    --sans:"Public Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#101114; --card:#101114; --card-sunk:#2B2E35;
      --ink:#F3F5F9; --ink-body:#C3CCE8; --ink-quiet:#C3CCE8;
      --rule:#2B2E35; --rule-strong:#3C4450; --accent:#C3CCE8; --clay:#FC3D05;
    }
  }
  :root[data-theme="light"] {
    --ground:#F3F5F9; --card:#F9FAFC; --card-sunk:#D9DEE7;
    --ink:#101114; --ink-body:#3C4450; --ink-quiet:#3C4450;
    --rule:#D9DEE7; --rule-strong:#C3CCE8; --accent:#3150FD; --clay:#B52C00;
  }
  :root[data-theme="dark"] {
    --ground:#101114; --card:#101114; --card-sunk:#2B2E35;
    --ink:#F3F5F9; --ink-body:#C3CCE8; --ink-quiet:#C3CCE8;
    --rule:#2B2E35; --rule-strong:#3C4450; --accent:#C3CCE8; --clay:#FC3D05;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--ground); color:var(--ink-body);
    font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  main { flex:1; display:flex; flex-direction:column; align-items:center; padding:3rem 1rem; }
  #clerk { width:100%; display:flex; justify-content:center; }
  .msg { max-width:400px; width:100%; margin:0 0 1rem; font-size:.8125rem; border-radius:0; padding:.5rem .625rem; }
  .msg.bad { background:var(--card-sunk); color:var(--clay); }
  .msg.ok { background:var(--card-sunk); color:var(--ink-body); }
  .msg[hidden] { display:none; }
  /* The wordmark: a Tangerine rule above roman AIKO and italic Group. There is no
     symbol; the rule is the mark. On the Deep header the type is Paper. */
  .wm { display:inline-flex; flex-direction:column; gap:3px; font-family:var(--serif); font-weight:400; line-height:.9; letter-spacing:.005em; color:var(--cream-text); }
  .wm::before { content:""; width:1.05em; height:.18em; background:#FC3D05; }
  .wm > span { white-space:nowrap; }
  .wm em { font-style:italic; }
  .site-brand .wm { font-size:26px; }
</style>
</head>
<body>

<header class="site-head">
  <span class="site-brand">
    <span class="wm" aria-hidden="true"><span>AIKO <em>Group</em></span></span>
    <span>
      <span class="name">Content Studio</span><br>
      <span class="who">aikogroup.io — internal</span>
    </span>
  </span>
</header>

<main>
  <p class="msg" id="msg" role="status" hidden></p>
  <!-- Clerk draws the sign-in box here: single sign-on and email and
       password, with its own forgotten-password flow. -->
  <div id="clerk"></div>
</main>

<script src="./assets/clerk.js"></script>
<script>
/* Signing in happens between this page and Clerk. Every other page then sends
   Clerk's session token to the Worker, which checks it and this app's list
   (kb.app_users) on every call. */
const msg = document.getElementById('msg');
function say(text, tone) {
  msg.textContent = text || '';
  msg.className = 'msg ' + (tone || 'ok');
  msg.hidden = !text;
}

/* Where to go after signing in: back to the page that sent you here. Only a
   page of this site, so the link can't be used to send someone elsewhere. */
const params = new URLSearchParams(location.search);
function nextPage() {
  const next = params.get('next') || '';
  return /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? './' + next : './';
}

/* Clerk's box in this page's colours, light or dark. */
function appearance() {
  const css = getComputedStyle(document.documentElement);
  const v = (name) => css.getPropertyValue(name).trim();
  return {
    variables: {
      colorPrimary: '#3150FD',
      colorBackground: v('--card'),
      colorText: v('--ink'),
      colorTextSecondary: v('--ink-quiet'),
      colorInputBackground: v('--ground'),
      colorInputText: v('--ink'),
      colorDanger: v('--clay'),
      fontFamily: v('--sans'),
      borderRadius: '6px',
    },
  };
}

const why = params.get('why');
if (why === 'expired') say('Your session ended. Sign in again.', 'ok');
if (why === 'not-listed') say('That email isn’t on the list for this app. Ask to be added.', 'bad');

AikoClerk.ready.then((clerk) => {
  const next = new URL(nextPage(), location.href).href;
  /* Already signed in, and not just bounced off the list: carry on. */
  if (clerk.user && why !== 'not-listed') { location.replace(next); return; }
  clerk.mountSignIn(document.getElementById('clerk'), {
    forceRedirectUrl: next,
    signUpForceRedirectUrl: next,
    appearance: appearance(),
  });
}, (err) => say(err.message, 'bad'));
</script>
</body>
</html>
